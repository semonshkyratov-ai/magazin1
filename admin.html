<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Админ</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,sans-serif;background:#0a0a0a;color:#e6e6e6;padding:20px;line-height:1.5}.wrap{max-width:560px;margin:0 auto}h1{font-size:1.2rem;font-weight:600;color:#fff;margin-bottom:16px}label{display:block;font-size:0.78rem;color:#888;text-transform:uppercase;letter-spacing:0.05em;margin-top:14px;margin-bottom:6px}input{width:100%;padding:12px 14px;background:#141414;border:1px solid #242424;border-radius:10px;color:#fff;font-size:0.9rem}button{width:100%;padding:14px;background:#fff;color:#000;border:none;border-radius:10px;font-weight:600;font-size:0.9rem;margin-top:18px;cursor:pointer}button.danger{background:#f87171;color:#fff;margin-top:8px}#log{margin-top:16px;background:#0d0d0d;border:1px solid #1e1e1e;border-radius:10px;padding:14px;font-family:ui-monospace,monospace;font-size:0.72rem;line-height:1.7;max-height:320px;overflow-y:auto;color:#666}.ok{color:#4ade80}.err{color:#f87171}.info{color:#60a5fa}.card{background:#111;border:1px solid #1e1e1e;border-radius:10px;padding:12px;margin-top:10px;display:flex;align-items:center;justify-content:space-between}.card span{font-size:0.85rem;color:#fff;flex:1;margin-right:10px}.card button{width:auto;padding:6px 12px;margin:0;font-size:0.75rem}</style></head><body><div class="wrap"><h1>Админ</h1><label>GitHub токен</label><input type="password" id="token"><label>Владелец</label><input type="text" id="owner"><label>Репозиторий</label><input type="text" id="repo" value="magazin"><label>Ссылка на APK</label><input type="text" id="url"><label>Название</label><input type="text" id="name"><label>Описание</label><input type="text" id="desc"><button onclick="add()">Добавить приложение</button><h1 style="margin-top:24px">Управление</h1><div id="apps"></div><div id="log">Ожидание...</div></div><script>var API="https://api.github.com";function log(m,c){var l=document.getElementById("log");l.innerHTML+="<div class=\""+(c||"info")+"\">"+m+"</div>";l.scrollTop=l.scrollHeight}function b64(s){return btoa(encodeURIComponent(s).replace(/%([0-9A-F]{2})/g,function(m,p){return String.fromCharCode("0x"+p)}))}async function api(ep,opt){var t=document.getElementById("token").value.trim();var h={"Authorization":"Bearer "+t,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"};var r=await fetch(API+ep,Object.assign({},opt,{headers:h}));if(!r.ok){var e=await r.json().catch(function(){return {}});throw new Error(r.status+": "+(e.message||""))}return r.json()}async function loadList(){var o=document.getElementById("owner").value.trim();var rp=document.getElementById("repo").value.trim();if(!o){document.getElementById("apps").innerHTML="";return}try{var cf=await api("/repos/"+o+"/"+rp+"/contents/apps.json");var a=JSON.parse(decodeURIComponent(escape(atob(cf.content.replace(/\n/g,"")))));document.getElementById("apps").innerHTML=a.map(function(x,i){return "<div class=\"card\"><span>"+x.name+"</span><button class=\"danger\" onclick=\"del("+i+")\">Удалить</button></div>"}).join("");}catch(e){}}async function del(i){var o=document.getElementById("owner").value.trim();var rp=document.getElementById("repo").value.trim();try{var cf=await api("/repos/"+o+"/"+rp+"/contents/apps.json");var a=JSON.parse(decodeURIComponent(escape(atob(cf.content.replace(/\n/g,"")))));var removed=a[i].name;a.splice(i,1);a.push({name:"Удалено: "+removed,description:"Причина: нарушение правил",url:"",deleted:true});await api("/repos/"+o+"/"+rp+"/contents/apps.json",{method:"PUT",body:JSON.stringify({message:"Delete "+removed,content:b64(JSON.stringify(a,null,2)),sha:cf.sha})});log("Удалено: "+removed,"ok");loadList();}catch(e){log("Ошибка: "+e.message,"err")}}async function add(){var o=document.getElementById("owner").value.trim();var rp=document.getElementById("repo").value.trim();var u=document.getElementById("url").value.trim();var n=document.getElementById("name").value.trim();var d=document.getElementById("desc").value.trim();if(!o||!u||!n){alert("Заполни всё");return}try{var cf=await api("/repos/"+o+"/"+rp+"/contents/apps.json");var a=[];try{a=JSON.parse(decodeURIComponent(escape(atob(cf.content.replace(/\n/g,"")))))}catch(e){a=[]}a.push({name:n,description:d,url:u});await api("/repos/"+o+"/"+rp+"/contents/apps.json",{method:"PUT",body:JSON.stringify({message:"Add "+n,content:b64(JSON.stringify(a,null,2)),sha:cf.sha})});log("Добавлено: "+n,"ok");loadList();}catch(e){log("Ошибка: "+e.message,"err")}}document.getElementById("owner").addEventListener("change",loadList);</script></body></html>
